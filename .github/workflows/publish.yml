name: publish-summary

# Re-summarise the artifacts of a finished monte-carlo run and commit the summary CSVs
# (and optionally the Efficiency sheets as compressed CSV) to branch results/<run_id>.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "monte-carlo run id"
        required: true
      efficiency_csv:
        description: "Also commit per-cell Efficiency tables as .csv.gz (true/false)"
        default: "false"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download all artifacts of the run (gh paginates; download-artifact stopped at 100)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          gh run download "${{ inputs.run_id }}" -R "${{ github.repository }}" -D results
          echo "artifact folders: $(ls results | wc -l)"
      - run: python mc/summarize.py results
      - name: Efficiency tables
        if: inputs.efficiency_csv == 'true'
        run: python mc/export_efficiency.py results publish/efficiency
      - name: Commit to results branch
        run: |
          mkdir -p publish
          cp results/summary_*.csv publish/
          find results -name 'regression_report.json' -exec cp {} publish/ \;
          cd publish
          git init -q -b "results/${{ inputs.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Summary of monte-carlo run ${{ inputs.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/results/${{ inputs.run_id }}"
